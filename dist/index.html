<html>

<head>
    <meta charset='utf-8' />
    <title>ESP32_DEVICE Control</title>
    <style>
        * {
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            background-color: rgb(200, 200, 200);
        }

        .section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: fit-content;
        }

        h1 {
            font-family: monospace;
            letter-spacing: 0.1rem;
            font-size: 5rem;
            margin-bottom: 10rem;
        }

        button {
            font-size: 3rem;
            font-weight: 900;
            font-family: monospace;
            text-shadow: 0px 0px 1px black;
            border: none;
        }

        .action-btn {
            margin: 4rem 0;
            border-radius: 4rem;
            letter-spacing: 0.1rem;
            width: 32rem;
            padding: 4rem;
            box-shadow: 0px 0px 3rem black;
        }

        .action-btn:active {
            animation: action-btn-transition 200ms;
        }

        .nav_buttons {
            margin-top: 10rem;
            display: grid;
            grid-template-rows: 3rem;
            gap: 10rem;
            grid-template-columns: 13rem 13rem;
        }

        .nav_btn {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            width: 100%;
            height: 100%;
            padding: 6rem 0;
            background-color: transparent;
        }

        .hide {
            visibility: hidden;
        }

        .nav_btn:active {
            animation: nav-btn-transition 200ms;
        }

        @keyframes nav-btn-transition {
            0% {
                font-size: 5rem;
            }

            100% {
                font-size: 3rem;
            }
        }

        @keyframes action-btn-transition {
            0% {
                font-size: 4rem;
                padding: 3.4rem;
                box-shadow: 0px 0px 5rem black;
            }

            100% {
                font-size: 3rem;
                padding: 4rem;
                box-shadow: 0px 0px 3rem black;
            }
        }

        .turn_on {
            background-color: rgb(50, 210, 50);
        }

        .turn_off {
            background-color: rgb(210, 0, 0);
        }

        .popup-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            position: fixed;
            height: 100%;
            width: 100%;
            background-color: rgba(100, 100, 100, 98%);
        }

        .popup-container__header {
            font-size: 3.5rem;
            text-align: center;
            line-height: 5rem;
        }

        .popup-container__btns {
            display: flex;
            gap: 10rem;
        }

        .popup-btn {
            font-size: 3.5rem;
            box-shadow: 0px 0px 3rem black;
            padding: 1rem 2rem;
            border-radius: 1.5rem;
            letter-spacing: 0.3rem;
        }

        .popup-btn:active {
            animation: popup-btn-transition 200ms;
        }

        .hide-popup {
            display: none;
        }

        @keyframes popup-btn-transition {
            0% {
                font-size: 4rem;
                padding: 1.2rem 2.2rem;
                box-shadow: 0px 0px 5rem black;
            }

            100% {
                font-size: 3.5rem;
                padding: 1rem 2rem;
                box-shadow: 0px 0px 3rem black;
            }
        }

        .confirm-btn {
            background-color: rgb(50, 210, 50);
        }

        .cancel-btn {
            background-color: rgb(210, 0, 0);
        }
    </style>
</head>

<body>
    <div class='light-control section'>
        <h1></h1>
        <button class='turn_on action-btn'>ON</button>
        <button class='turn_off action-btn'>OFF</button>
    </div>
    <nav class='nav_buttons'>
        <button class='nav_btn previous'>
            < </button>
                <button class='nav_btn next'> > </button>
    </nav>

    <div class='popup-container hide-popup'>
        <h1 class='popup-container__header'>Tem certeza que deseja </br> desligar a Tomada?</h1>
        <div class='popup-container__btns'>
            <button class='popup-btn confirm-btn'>Sim</button>
            <button class='popup-btn cancel-btn'>Não</button>
        </div>
    </div>

    <script>
        const light = 'Lâmpada', outlet = 'Tomada';

        const h1 = document.querySelector('h1');
        const btnOn = document.querySelector('.turn_on');
        const btnOff = document.querySelector('.turn_off');
        const btnPrevious = document.querySelector('.previous');
        const btnNext = document.querySelector('.next');
        const popupContainer = document.querySelector('.popup-container');
        const btnConfirm = document.querySelector('.confirm-btn');
        const btnCancel = document.querySelector('.cancel-btn');

        h1.innerText = light;

        function validateShowNavBtns(h1ElementTextContent) {
            if (h1ElementTextContent == light) {
                btnPrevious.classList.add('hide');
                btnNext.classList.remove('hide');
            } else if (h1ElementTextContent == outlet) {
                btnNext.classList.add('hide');
                btnPrevious.classList.remove('hide');
            }
        }

        validateShowNavBtns(h1.innerText)

        function sendRequest(path) {
            fetch(path, { method: 'GET' }).then((req) => {
                if (req) {
                    console.log('Request Enviado com sucesso');
                }
            });
        }

        btnPrevious.addEventListener('click', () => {
            h1.innerText = light;
            validateShowNavBtns(h1.innerText)
        })

        btnNext.addEventListener('click', () => {
            h1.innerText = outlet;
            validateShowNavBtns(h1.innerText)
        })

        btnOn.addEventListener('click', () => {
            switch (h1.innerText) {
                case light: {
                    sendRequest('/H1');
                    break;
                }
                case outlet: {
                    sendRequest('/H2');
                    break;
                }
            }
        })

        btnOff.addEventListener('click', () => {
            switch (h1.innerText) {
                case light: {
                    sendRequest('/L1');
                    break;
                }
                case outlet: {
                    popupContainer.classList.remove('hide-popup');
                    break;
                }
            }
        })
        btnConfirm.addEventListener('click', () => {
            sendRequest('/L2');
            popupContainer.classList.add('hide-popup');
        });
        btnCancel.addEventListener('click', () => {
            popupContainer.classList.add('hide-popup');
        });
    </script>
</body>

</html>
