<html>

<head>
    <title>ESP32_DEVICE Control</title>
    <style>
        * {
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            background-color: rgb(200, 200, 200);
        }

        button {
            margin: 5rem;
            border-radius: 4rem;
            font-size: 3rem;
            font-weight: 900;
            font-family: monospace;
            letter-spacing: 0.1rem;
            text-shadow: 0px 0px 1px black;
            border: none;
            width: 32rem;
            padding: 4rem;
            box-shadow: 0px 0px 3rem black;
        }

        button:active {
            animation: btn-transition 200ms;
        }

        @keyframes btn-transition {
            0% {
                font-size: 4rem;
                padding: 3.4rem;
                box-shadow: 0px 0px 5rem black;
            }

            100% {
                font-size: 3rem;
                padding: 4rem;
                box-shadow: 0px 0px 3rem black;
            }
        }

        .turn_on {
            background-color: rgb(50, 210, 50);
        }

        .turn_off {
            background-color: rgb(210, 0, 0);
        }
    </style>
</head>

<body>
    <button class='turn_on'>ON</button>
    <button class='turn_off'>OFF</button>

    <script>
        function sendRequest(path) {
            fetch(path, { method: 'GET' }).then((req) => {
                if (req) {
                    console.log('Request Enviado com sucesso');
                }
            });
        }

        const btnOn = document.querySelector('.turn_on');
        const btnOff = document.querySelector('.turn_off');

        btnOn.addEventListener('click', () => {
            sendRequest('/H');
        })

        btnOff.addEventListener('click', () => {
            sendRequest('/L')
        })
    </script>
</body>

</html>
